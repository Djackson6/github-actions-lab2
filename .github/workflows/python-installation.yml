name: Installing Python
on: [push]
jobs:
  build:
    runs-on: '${{ matrix.os }}'
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
        py-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
    - name: Set up Python^M
      uses: actions/setup-python@v5^M
      with:
        python-version: '${{ matrix.py-version }}'
